[project]
name = "minevaluation-ai"
version = "0.1.0"
description = "SEC EDGAR data -> normalized financials -> FCFF/DCF intrinsic value with margin of safety"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "anthropic>=0.40",
    "pysbd>=0.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    # Upper-bounded deliberately. This project has no explicit `select`,
    # so the rule set IS whatever ruff's defaults are - and 0.17 dropped
    # flake8-datetimez (DTZ) from them. CI installed 0.17.3, decided the
    # four `# noqa: DTZ011` comments on intentional calendar-date
    # defaults were unused, and failed RUF100 on code that passed
    # locally on 0.16.3. An unpinned linter means CI lints something
    # different from what the developer ran. Moving to 0.17 means
    # declaring `select` explicitly rather than inheriting defaults;
    # until then, pin.
    "ruff>=0.16,<0.17",
]
# Heavy (~1GB incl. model weights) and only needed for local FinBERT
# sentiment scoring - kept out of the base install and out of CI.
# pip install -e ".[dev,sentiment]" to use/test it locally.
sentiment = [
    "transformers>=4.40",
    "torch>=2.0",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# B008: FastAPI's Depends()-as-default-argument is the documented DI
# pattern, not the mutable-default-argument bug this rule targets.
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: hits the real SEC EDGAR API (network required)",
    "llm: hits the real Anthropic API (network required, costs real money - excluded from CI)",
    "model: loads a local ML model requiring the optional [sentiment] extra - excluded from CI",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
