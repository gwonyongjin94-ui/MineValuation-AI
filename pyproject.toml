[project]
name = "safetymargin-ai"
version = "0.1.0"
description = "SEC EDGAR data -> normalized financials -> FCFF/DCF intrinsic value with margin of safety"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "anthropic>=0.40",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# B008: FastAPI's Depends()-as-default-argument is the documented DI
# pattern, not the mutable-default-argument bug this rule targets.
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: hits the real SEC EDGAR API (network required)",
    "llm: hits the real Anthropic API (network required, costs real money - excluded from CI)",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
